name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RestWorkTimer.sln

      - name: Build
        run: dotnet build RestWorkTimer.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/RestWorkTimer.Tests/RestWorkTimer.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  publish:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish src/RestWorkTimer/RestWorkTimer.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o artifacts/publish

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: RestWorkTimer-win-x64
          path: artifacts/publish/RestWorkTimer.exe
